<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    table, th, td {
      border: 1px solid #7f8c8d;
      padding: 8px 12px;
    }
    table {
      border-collapse: separate;
      border-spacing: 2px;
      width: 550px;
    }
    .bold {
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>
  <table>
    <tr>
      <th rowspan="3" class="bold">Day</th>
      <th colspan="3" class="bold">seminar</th>
    </tr>
    <tr>
      <th colspan="2" class="bold">schedule</th>
      <th rowspan="2" class="bold">Topic</th>
    </tr>
    <tr>
      <th>Begin</th>
      <th>End</th>
    </tr>

    <tr>
      <td rowspan="2">Monday</td>
      <td rowspan="2">8:00am</td>
      <td rowspan="2">5:00pm</td>
      <td>Introduction to XML</td>
    </tr>
    <tr>
      <td>validity:DTD and Relax NG</td>
    </tr>
    <tr>
      <td rowspan="3">Tuesday</td>
      <td>8:00am</td>
      <td>11:00pm</td>
      <td rowspan="2">XPath</td>
    </tr>
    <tr>
      <td>11:00am</td>
      <td>2:00pm</td>
    </tr>
    <tr>
      <td>2:00pm</td>
      <td>5:00pm</td>
      <td>XSL Transformations</td>
    </tr>

    <tr>
      <td>Wednesday</td>
      <td>8:00am</td>
      <td>12:00pm</td>
      <td>XSL Formatting Objects</td>
    </tr>
  </table>

</body>
</html>

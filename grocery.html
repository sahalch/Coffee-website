<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h2 {
      font-family: serif;
      font-weight: bold;
    }
    table {
      border-collapse: collapse;
      width: 500px;
    }
    th, td {
      border: 1px solid #7f8c8d;
      padding: 12px 10px;
    }
    th {
      background-color: #afbaaf;
      color: #000;
      font-weight: bold;
      text-align: center;
    }
    /* Light blue highlight on 2nd data row */
    .highlight-row {
      background-color: #d2e4f0;
    }
    .text-center {
      text-align: center;
    }
    .bold {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Grocery items Bill</h2>

  <table>
    <thead>
      <tr>
        <th>Item Name</th>
        <th>Quantity</th>
        <th>Price</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Potatoes</td>
        <td class="text-center">51</td>
        <td class="text-center">$1.00</td>
      </tr>
      <tr class="highlight-row">
        <td>Nuts</td>
        <td class="text-center">20</td>
        <td class="text-center">$5</td>
      </tr>
      <tr>
        <td>Onions</td>
        <td class="text-center">4</td>
        <td class="text-center">$3.00</td>
      </tr>
      <tr>
        <td>Very long awkwardly named yet still delicious item here</td>
        <td class="text-center">4</td>
        <td class="text-center">$3.00</td>
      </tr>
      <tr>
        <td>Carrots</td>
        <td class="text-center">12</td>
        <td class="text-center">$2.99</td>
      </tr>
      <tr>
        <td></td>
        <td class="text-center bold">Total price</td>
        <td class="text-center bold">$33.79</td>
      </tr>
    </tbody>
  </table>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Complete HTML Form</title>
</head>

<body>

    <h1>Complete Registration Form</h1>

    <form action="/submit" method="post" enctype="multipart/form-data">
        <label for="fullname">Full Name:</label>
        <input
            type="text"
            id="fullname"
            name="fullname"
            placeholder="Enter your full name"
            required
        >
        <br><br>
        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="example@gmail.com"
            required
        >
        <br><br>
        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >
        <br><br>
        <label for="age">Age:</label>
        <input
            type="number"
            id="age"
            name="age"
            min="1"
            max="100"
            placeholder="Enter your age"
        >
        <br><br>
        <label for="dob">Date of Birth:</label>
        <input
            type="date"
            id="dob"
            name="dob"
        >
        <br><br>
        <label for="time">Preferred Time:</label>
        <input
            type="time"
            id="time"
            name="time"
        >
        <br><br>
        <label for="website">Website:</label>
        <input
            type="url"
            id="website"
            name="website"
            placeholder="https://example.com"
        >
        <br><br>
        <p>Gender:</p>
        <input
            type="radio"
            id="male"
            name="gender"
            value="male"
        >
        <label for="male">Male</label>

        <input
            type="radio"
            id="female"
            name="gender"
            value="female"
        >
        <label for="female">Female</label>

        <input
            type="radio"
            id="other"
            name="gender"
            value="other"
        >
        <br><br>
        <p>Select your skills:</p>
        <input
            type="checkbox"
            id="html"
            name="skills"
            value="html"
        >
        <label for="html">HTML</label>

        <input
            type="checkbox"
            id="css"
            name="skills"
            value="css"
        >
        <label for="css">CSS</label>

        <input
            type="checkbox"
            id="javascript"
            name="skills"
            value="javascript"
        >
        <label for="javascript">JavaScript</label>
        <input
            type="checkbox"
            id="react"
            name="skills"
            value="react"
        >
        <label for="react">React</label>
        <br><br>
        <label for="address">Address:</label>
        <br>
        <textarea
            id="address"
            name="address"
            rows="5"
            cols="40"
            placeholder="Enter your address"
        ></textarea>
        <br><br>
        <label for="photo">Upload Profile Photo:</label>
        <input
            type="file"
            id="photo"
            name="photo"
            accept="image/*"
        >
        <br><br>
        <label for="experience">
            Experience:
        </label>
        <input
            type="range"
            id="experience"
            name="experience"
            min="0"
            max="10"
            value="0"
        >
        <br><br>
         <label for="color">Favorite Color:</label>
        <input
            type="color"
            id="color"
            name="color"
        >
        <br><br>
        <input
            type="checkbox"
            id="terms"
            name="terms"
            required
        >
        <label for="terms">
            I agree to the Terms and Conditions
        </label>
        <br><br>
        <button type="button">
            Normal Button
        </button>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    table, th, td {
      border: 1px solid #7f8c8d;
      padding: 10px 14px;
      text-align: center;
    }
    table {
      border-collapse: separate;
      border-spacing: 2px;
      width: 550px;
    }
    .bold {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <table>
    <tr>
      <th colspan="6" class="bold">time table</th>
    </tr>
    <tr>
      <th rowspan="6" class="bold">Hours</th>
      <td>monday</td>
      <td>Tuesday</td>
      <td>wednesday</td>
      <td>Thursday</td>
      <td>friday</td>
    </tr>

    <tr>
      <td>science</td>
      <td>maths</td>
      <td>science</td>
      <td>maths</td>
      <td>arts</td>
    </tr>
    <tr>
      <td>social</td>
      <td>History</td>
      <td>english</td>
      <td>social</td>
      <td>sports</td>
    </tr>

    <tr>
      <th colspan="5" class="bold">Lunch</th>
    </tr>

    <tr>
      <td>science</td>
      <td>maths</td>
      <td>science</td>
      <td>maths</td>
      <td rowspan="2">project</td>
    </tr>

    <tr>
      <td>social</td>
      <td>History</td>
      <td>english</td>
      <td>social</td>
    </tr>
  </table>

</body>
</html>

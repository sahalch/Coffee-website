<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
   h1{
    text-align: center;
    color: blue;
    
   }
    .wrapper{
        display: grid;
        grid-template-columns: 200px 200px 200px;
        grid-template-rows: auto auto auto;
    }
    .wrapper div{
        padding: 10px;
    }
    .item{
        background: #f2e0e6;
    }
</style>
<body>
    <h1>Gallery</h1>
    <section class="wrapper">
        <div class="item">
            <img src="1.png" alt="img" width="180">
        </div>
        <div class="item">
            <img src="2.png" alt="img" width="180">
        </div>
         <div class="item">
            <img src="3.png" alt="img" width="180">
        </div>
         <div class="item">
            <img src="4.png" alt="img" width="180">
        </div>
         <div class="item">
            <img src="5.png" alt="img" width="180">
        </div>
         <div class="item">
            <img src="1.png" alt="img" width="180">
        </div>
      
    </section>
</body>
</html>

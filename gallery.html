<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masonry Gallery - Full Screen Fit</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <style>
    /* 1. Prevent scrolling and lock body to viewport height */
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden; 
      background-color: #120b1e;
      display: flex;
      align-items: center; /* Centers the container vertically */
    }

    /* 2. Container takes full height minus a small margin */
    .container {
      height: 100vh;
      padding-top: 1rem;
      padding-bottom: 1rem;
    }

    /* 3. Ensure structural columns and rows take 100% of the container height */
    .main-row, .left-col, .nested-row, .d-flex {
      height: 100%;
    }

    /* 4. Force images to fill their bounds without distorting */
    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 5. Left Section: Assign height percentages minus Bootstrap's g-3 gap space */
    .left-top { height: calc(30% - 0.66rem); }
    .left-mid { height: calc(35% - 0.66rem); }
    .left-bot { height: calc(35% - 0.66rem); }

    /* 6. Vertical Stack Ratios: Use flex-grow to distribute height inside the columns */
    .flex-3 { flex: 3; }
    .flex-4 { flex: 4; }
    .flex-6 { flex: 6; }
  </style>
</head>
<body>

  <div class="container">
    <div class="row g-3 main-row">
      
      <!-- Left Section (2 columns wide) -->
      <div class="col-12 col-lg-6 left-col">
        <div class="row g-3 nested-row">
          <!-- Top Row -->
          <div class="col-6 left-top">
            <img src="gallery1.jpeg" alt="Gallery Image 1" class="rounded">
          </div>
          <div class="col-6 left-top">
            <img src="gallery2.jpeg" alt="Gallery Image 2" class="rounded">
          </div>
          <!-- Middle Row -->
          <div class="col-12 left-mid">
            <img src="gallery3.jpeg" alt="Gallery Image 3" class="rounded">
          </div>
          <!-- Bottom Row -->
          <div class="col-12 left-bot">
            <img src="gallery4.jpeg" alt="Gallery Image 4" class="rounded">
          </div>
        </div>
      </div>

      <!-- Center-Right Section (Vertical stack) -->
      <div class="col-12 col-sm-6 col-lg-3">
        <div class="d-flex flex-column gap-3">
          <img src="gallery5.jpeg" alt="Gallery Image 5" class="rounded flex-4">
          <img src="gallery6.jpeg" alt="Gallery Image 6" class="rounded flex-3">
          <img src="gallery7.jpeg" alt="Gallery Image 7" class="rounded flex-3">
        </div>
      </div>

      <!-- Far-Right Section (Vertical stack) -->
      <div class="col-12 col-sm-6 col-lg-3">
        <div class="d-flex flex-column gap-3">
          <img src="gallery8.jpeg" alt="Gallery Image 8" class="rounded flex-4">
          <img src="gallery9.jpeg" alt="Gallery Image 9" class="rounded flex-6">
        </div>
      </div>

    </div>
  </div>

</body>
</html>

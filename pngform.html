<!DOCTYPE html>
<html>
 <head>
  <title>Student Registration Form</title>    
 </head>
 <body bgcolor="MistyRose">
 <form>
  <table align="center" width="700" cellpadding="10" > 
  <tr>
   <td colspan="2" align="center">
     <h1>Student Registration Form</h1>
   </td>
  </tr>
  <tr>
    <td>Roll no. :</td>
    <td><input type="text" size="50"/></td>
  </tr>
  <tr>
    <td>Student name :</td>
    <td>
      <input type="text" size="21" Placeholder="First Name"/>
      -
      <input type="text" size="21" Placeholder="Last Name"/>
    </td>
  </tr>
  <tr>
    <td>Father's name :</td>
    <td><input type="text" size="50"/></td>
  </tr>
  <tr>
    <td>Date of birth :</td>
    <td>
      <input type="date" size="3" Placeholder="Day" /> 
    </td>
  </tr>
  <tr>
    <td>Mobile no. :</td>
    <td>
      <input type="text" size="3" value="+" /> -
      <input type="tel" size="50" /></td>
  </tr>
  <tr>
    <td>Email id :</td>
    <td><input type="email" size="50"/></td>
  </tr>
  <tr>
    <td>Password :</td>
    <td><input type="password" size="50"/></td>
  </tr>
  <tr>
    <td>Gender :</td>
    <td>
      <input type="radio" name="g" /> Male
      <input type="radio" name="g" /> Female
    </td>
  </tr>
  <tr>
    <td>Department :</td>
    <td>
      <input type="checkbox" /> CSE
      <input type="checkbox" /> IT
      <input type="checkbox" /> ECE
      <input type="checkbox" /> Civil
      <input type="checkbox" /> Mech
      </td>
  </tr>
  <tr>
    <td>Course :</td>
    <td><select>
        <option>----------------------Select Current Course's------------------------</option>
        <option>Javascript</option>
        <option>Node</option>
        <option>Express</option>
        <option>React</option>
      </select>
    </td>
  </tr> 
   <tr>
    <td>Student photo :</td>
    <td><input type="file" /></td>
  </tr>
  <tr>
    <td>City :</td>
    <td><input type="text"  size="50"/></td>
  </tr>
  <tr>
    <td>Address :</td>
    <td><textarea cols="48" rows="5"></textarea></td>
  </tr>  
  <tr>
    <td colspan="2" align="center">
    	<input type="submit" value="Register" />
     </td>
  </tr>
  </table>
 </form>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<style>
button {
  background-color: #04AA6D;
  border: none;
  color: white;
  padding: 15px 32px;
  font-size: 16px;
  cursor: pointer;
}

button:active {
  background-color: pink;
}
</style>
</head>
<body>

<h1>:active</h1>

<p>The :active pseudo-class styles the active button:</p>

<button>Click Me</button>

</body>
</html>

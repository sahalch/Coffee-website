<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 400px;
            background-color: bisque;

        }
        .one,.two,.three{
                height: 300px;
                width: 300px;
                background-color: blue;
                border: 1px solid red;
        }
        .three{
            order: 1;
        }
        .one{
            order: 3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="one">
            <h1>first</h1>
        </div>
        <div class="two"><h2>second</h2></div>
        <div class="three">
            <h1>third</h1>
        </div>
    </div>
</body>
</html>
